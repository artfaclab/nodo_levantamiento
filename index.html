<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NODO · Levantamiento</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: herramienta de obra, sobria y clara, se usa con una mano en sitio
   IDEA: la libreta de levantamiento: planta a mano alzada y alzado por muro
   PICTURE: la planta y el alzado son la herramienta misma, grandes, arriba
   COLOUR and TYPE: piedra clara, tinta negra, ladrillo como acento; Schibsted Grotesk
   LAYOUT: una columna, barra fija abajo con las acciones */
:root{color-scheme:light dark;--bg:light-dark(#efede9,#171513);--pn:light-dark(#fff,#211e1b);--ink:light-dark(#141414,#ece8e2);--mut:light-dark(#6b665f,#a39d94);--ln:light-dark(#d9d5ce,#3a3530);--ac:#c8371e;--ok:#2e6f8e}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Schibsted Grotesk',system-ui,sans-serif;overflow-x:clip;padding-bottom:92px}
header{display:flex;justify-content:space-between;align-items:center;padding:14px max(4vw,16px);border-bottom:2px solid var(--ink);background:var(--pn);position:sticky;top:0;z-index:5}
header b{font-size:22px;letter-spacing:.02em}header small{color:var(--mut)}
main{max-width:760px;margin:0 auto;padding:16px max(4vw,14px)}
h2{font-size:26px;line-height:1.1;margin:6px 0 12px}
.pn{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 4px}
input,select{width:100%;font:16px 'Schibsted Grotesk',sans-serif;padding:10px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--ink);min-height:44px}
input:focus,button:focus-visible,select:focus{outline:2px solid var(--ac);outline-offset:1px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
button{font:600 15px 'Schibsted Grotesk',sans-serif;min-height:44px;padding:0 14px;border-radius:8px;border:1px solid var(--ink);background:var(--pn);color:var(--ink);cursor:pointer}
button.p{background:var(--ink);color:var(--pn)}button.a{background:var(--ac);border-color:var(--ac);color:#fff}button.s{border-color:var(--ln)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.esp{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;padding:14px;margin-bottom:8px;border-color:var(--ln);background:var(--pn)}
.esp span{color:var(--mut);font-weight:400;font-size:14px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--pn);border-top:1px solid var(--ln);padding:12px max(4vw,14px);display:flex;gap:8px;justify-content:flex-end;z-index:5}
.fig{position:relative;height:min(62vh,460px);background:var(--pn);border:1px solid var(--ln);border-radius:10px;touch-action:none;overflow:hidden}
.fig svg{position:absolute;inset:0;width:100%;height:100%}
.hint{font-size:14px;color:var(--mut);margin:8px 2px}
.el{border-top:1px solid var(--ln);padding:10px 0}.el:first-child{border-top:0}
.el h4{margin:0 0 4px;display:flex;justify-content:space-between;align-items:center;font-size:15px}
.fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:8px}
.fotos div{position:relative}.fotos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block}
.fotos button{position:absolute;top:4px;right:4px;min-height:28px;padding:0 8px;font-size:12px}
.warn{color:var(--ac);font-size:14px;margin-top:6px}.okt{color:var(--ok);font-size:14px;margin-top:6px}
#msg{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--pn);padding:10px 16px;border-radius:8px;font-size:14px;display:none;z-index:9;max-width:90vw}
textarea{width:100%;height:120px;font:12px monospace;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--ink)}
.hid{display:none}
</style></head><body>
<header><b>NODO</b><small>Levantamiento · Grupo Ensamble</small></header>
<main id="app"></main>
<div class="bar" id="bar"></div>
<div id="msg"></div>
<input type="file" id="fFoto" accept="image/*" multiple class="hid">
<input type="file" id="fCargar" accept=".espacio,.json,application/json" class="hid">
<script>
{
const KEY='nodo_levantamiento_v1';
const hoy=()=>{const d=new Date();return d.toLocaleDateString('es-MX',{day:'2-digit',month:'2-digit',year:'numeric'})};
const nuevo=()=>({formato:'NODO-ESPACIO',version:1,unidades:'mm',proyecto:'',cliente:'',usuario:'',fecha:hoy(),espacios:[]});
let P=nuevo(),vista={v:'inicio',e:-1,m:-1},orto=true,dl=null;
try{const s=localStorage.getItem(KEY);if(s)P=JSON.parse(s)}catch(e){}
const guardar=()=>{try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){aviso('No se pudo guardar en el teléfono (fotos muy pesadas). Envía el archivo para no perderlo.')}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
const aviso=t=>{const m=$('msg');m.textContent=t;m.style.display='block';clearTimeout(aviso.t);aviso.t=setTimeout(()=>m.style.display='none',3200)};
const cm=mm=>mm==null||mm===''?'':String(Math.round(mm)/10);
const mm=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?Math.round(n*10):null};
const E=()=>P.espacios[vista.e];
const TIPOS={puerta:'Puerta',ventana:'Ventana',contacto:'Contacto',apagador:'Apagador'};

/* ---------- geometría ---------- */
function muros(es){const p=es.puntos,n=p.length;if(!es.cerrado)return[];return p.map((a,i)=>({i,a,b:p[(i+1)%n]}))}
function area(p){let s=0;p.forEach((a,i)=>{const b=p[(i+1)%p.length];s+=a[0]*b[1]-b[0]*a[1]});return s/2}
// vértices reales en mm: direcciones del trazo, largos capturados (o estimados)
function real(es){
  const ms=muros(es);if(!ms.length)return null;
  const dl=ms.map(m=>Math.hypot(m.b[0]-m.a[0],m.b[1]-m.a[1]));
  const con=ms.filter((m,i)=>es.muros[i]&&es.muros[i].largo);const k=con.length?con.reduce((s,m)=>s+es.muros[m.i].largo/dl[m.i],0)/con.length:100;
  let x=0,y=0;const v=[[0,0]];let falt=0;
  ms.forEach((m,i)=>{const L=(es.muros[i]&&es.muros[i].largo)||(falt++,dl[i]*k);const ux=(m.b[0]-m.a[0])/dl[i],uy=(m.b[1]-m.a[1])/dl[i];x+=ux*L;y+=uy*L;v.push([x,y])});
  const cierre=Math.hypot(v[v.length-1][0],v[v.length-1][1]);v.pop();
  return{v:v.map(q=>[Math.round(q[0]),Math.round(q[1])]),cierre:Math.round(cierre),falt}
}

/* ---------- vistas ---------- */
function render(){({inicio,espacio,muro}[vista.v])();window.scrollTo(0,0)}
function inicio(){
  $('app').innerHTML=`
  <div class="pn"><div class="g2">
    <div><label for="pUs">Usuario</label><input id="pUs" value="${esc(P.usuario)}"></div>
    <div><label for="pFe">Fecha</label><input id="pFe" value="${esc(P.fecha)}"></div></div>
    <label for="pPr">Proyecto</label><input id="pPr" value="${esc(P.proyecto)}">
    <label for="pCl">Cliente</label><input id="pCl" value="${esc(P.cliente)}"></div>
  <h2>Espacios</h2>
  ${P.espacios.length?P.espacios.map((e,i)=>`<button class="esp" data-e="${i}"><b>${esc(e.nombre)}</b><span>${e.cerrado?e.puntos.length+' muros':'sin planta'} · ${(e.fotos||[]).length} fotos</span></button>`).join(''):'<p class="hint">Agrega el primer espacio para empezar a medir.</p>'}
  <button class="s" id="bNuevoE">+ Agregar espacio</button>
  <p class="hint">Se guarda solo en este teléfono. Al terminar, «Enviar» genera el archivo .espacio para mandarlo por WhatsApp como documento.</p>
  <details class="pn"><summary>Más</summary><div class="row" style="margin-top:10px"><button class="s" id="bNuevoP">Nuevo proyecto</button><button class="s" id="bCopiar">Copiar datos</button></div></details>`;
  [['pUs','usuario'],['pFe','fecha'],['pPr','proyecto'],['pCl','cliente']].forEach(([id,k])=>$(id).oninput=ev=>{P[k]=ev.target.value;guardar()});
  document.querySelectorAll('.esp').forEach(b=>b.onclick=()=>{vista={v:'espacio',e:+b.dataset.e,m:-1};render()});
  $('bNuevoE').onclick=()=>{const n=P.espacios.length+1;P.espacios.push({nombre:'ESPACIO '+String(n).padStart(2,'0'),altura:2400,espesor:150,puntos:[],cerrado:false,muros:[],fotos:[]});guardar();vista={v:'espacio',e:P.espacios.length-1,m:-1};render()};
  $('bNuevoP').onclick=()=>{if($('bNuevoP').dataset.c){P=nuevo();guardar();render()}else{$('bNuevoP').dataset.c=1;$('bNuevoP').textContent='Toca otra vez para borrar todo'}};
  $('bCopiar').onclick=async()=>{try{await navigator.clipboard.writeText(JSON.stringify(P));aviso('Copiado')}catch(e){aviso('No se pudo copiar')}};
  $('bar').innerHTML=`<button class="s" id="bCargar">Cargar</button><button class="a" id="bEnviar">Enviar</button>`;
  $('bCargar').onclick=()=>$('fCargar').click();$('bEnviar').onclick=enviar;
}
function espacio(){
  const es=E(),ms=muros(es),R=real(es);
  $('app').innerHTML=`
  <div class="row" style="justify-content:space-between"><input id="eNom" value="${esc(es.nombre)}" style="max-width:60%;font-weight:700"><button class="s" id="bBorrarE">Borrar</button></div>
  <p class="hint">${es.cerrado?'Toca un muro para ver su alzado y medirlo.':'Toca las esquinas en orden. Toca la primera para cerrar la planta. Solo la forma: las medidas van después, muro por muro.'}</p>
  <div class="fig" id="fig"><svg id="sv"></svg></div>
  <div class="row" style="margin:10px 0">${es.cerrado?'<button class="s" id="bReabrir">Editar trazo</button>':`<button class="${orto?'p':'s'}" id="bOrto">${orto?'90° activado':'Libre (diagonal)'}</button><button class="s" id="bDeshacer">Deshacer</button><button class="s" id="bCerrar">Cerrar planta</button>`}</div>
  ${es.cerrado?`<div class="pn"><div class="g2"><div><label for="eAlt">Altura del espacio (cm)</label><input id="eAlt" inputmode="decimal" value="${cm(es.altura)}"></div><div><label for="eEsp">Espesor de muro (cm)</label><input id="eEsp" inputmode="decimal" value="${cm(es.espesor)}"></div></div>
   ${R?(R.falt?`<p class="warn">Faltan ${R.falt} de ${ms.length} muros por medir.</p>`:R.cierre>20?`<p class="warn">La planta no cierra por ${cm(R.cierre)} cm: revisa los largos o el trazo.</p>`:'<p class="okt">Planta medida y cerrada.</p>'):''}</div>`:''}
  <div class="pn"><b>Fotos del espacio</b><div class="fotos">${(es.fotos||[]).map((f,i)=>`<div><img src="${f.img}" alt="Foto ${i+1}"><button data-bf="${i}">×</button></div>`).join('')}</div><div class="row" style="margin-top:8px"><button class="s" id="bFoto">+ Foto</button></div></div>`;
  dibujaPlanta();
  $('eNom').oninput=ev=>{es.nombre=ev.target.value;guardar()};
  $('bBorrarE').onclick=()=>{const b=$('bBorrarE');if(b.dataset.c){P.espacios.splice(vista.e,1);guardar();vista={v:'inicio'};render()}else{b.dataset.c=1;b.textContent='¿Seguro?'}};
  if(es.cerrado){$('bReabrir').onclick=()=>{es.cerrado=false;guardar();render()};
    $('eAlt').onchange=ev=>{es.altura=mm(ev.target.value)||es.altura;guardar()};$('eEsp').onchange=ev=>{es.espesor=mm(ev.target.value)||es.espesor;guardar();dibujaPlanta()}}
  else{$('bOrto').onclick=()=>{orto=!orto;render()};$('bDeshacer').onclick=()=>{es.puntos.pop();guardar();dibujaPlanta()};$('bCerrar').onclick=cerrar}
  $('bFoto').onclick=()=>{fotoMuro=null;$('fFoto').click()};
  document.querySelectorAll('[data-bf]').forEach(b=>b.onclick=()=>{es.fotos.splice(+b.dataset.bf,1);guardar();render()});
  $('bar').innerHTML=`<button class="s" id="bAtras">‹ Espacios</button>`;$('bAtras').onclick=()=>{vista={v:'inicio'};render()};
}
function cerrar(){const es=E();if(es.puntos.length<3){aviso('Traza al menos 3 esquinas');return}es.cerrado=true;while(es.muros.length<es.puntos.length)es.muros.push({largo:null,espesor:null,zoclo:0,elementos:[]});es.muros.length=es.puntos.length;guardar();render()}
function dibujaPlanta(){
  const es=E(),s=$('sv'),W=s.clientWidth,H=s.clientHeight,G=24;if(!W)return;
  const p=es.puntos,ms=muros(es);
  let grid='';for(let x=G/2;x<W;x+=G)for(let y=G/2;y<H;y+=G)grid+=`<circle cx="${x}" cy="${y}" r="1" fill="var(--ln)"/>`;
  const sg=area(p)>0?1:-1,t=Math.max(4,(es.espesor||150)/25);
  const gruesos=ms.map(m=>{const dx=m.b[0]-m.a[0],dy=m.b[1]-m.a[1],L=Math.hypot(dx,dy)||1,nx=-dy/L*sg,ny=dx/L*sg;const o=[-nx*t,-ny*t];
    return`<polygon points="${m.a[0]},${m.a[1]} ${m.b[0]},${m.b[1]} ${m.b[0]+o[0]},${m.b[1]+o[1]} ${m.a[0]+o[0]},${m.a[1]+o[1]}" fill="var(--ink)" opacity=".18"/>`}).join('');
  const lin=ms.map(m=>{const w=es.muros[m.i]||{},mx=(m.a[0]+m.b[0])/2,my=(m.a[1]+m.b[1])/2;
    return`<g data-m="${m.i}" style="cursor:pointer"><line x1="${m.a[0]}" y1="${m.a[1]}" x2="${m.b[0]}" y2="${m.b[1]}" stroke="transparent" stroke-width="26"/><line x1="${m.a[0]}" y1="${m.a[1]}" x2="${m.b[0]}" y2="${m.b[1]}" stroke="${w.largo?'var(--ink)':'var(--ac)'}" stroke-width="3"/>
    <circle cx="${mx}" cy="${my}" r="13" fill="var(--pn)" stroke="var(--ink)"/><text x="${mx}" y="${my+5}" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)">${m.i+1}</text>
    ${w.largo?`<text x="${mx}" y="${my+28}" text-anchor="middle" font-size="12" fill="var(--mut)">${cm(w.largo)}</text>`:''}</g>`}).join('');
  const abierto=!es.cerrado&&p.length>1?`<polyline points="${p.map(q=>q.join(',')).join(' ')}" fill="none" stroke="var(--ink)" stroke-width="3"/>`:'';
  const pts=p.map((q,i)=>`<circle cx="${q[0]}" cy="${q[1]}" r="${i==0&&!es.cerrado?9:5}" fill="${i==0?'var(--ac)':'var(--ink)'}"/>`).join('');
  s.innerHTML=grid+gruesos+abierto+lin+pts;
  s.querySelectorAll('[data-m]').forEach(g=>g.onclick=ev=>{ev.stopPropagation();vista={v:'muro',e:vista.e,m:+g.dataset.m};render()});
  s.onpointerup=ev=>{if(es.cerrado)return;const r=s.getBoundingClientRect();let x=Math.round((ev.clientX-r.left-G/2)/G)*G+G/2,y=Math.round((ev.clientY-r.top-G/2)/G)*G+G/2;
    if(p.length&&Math.hypot(x-p[0][0],y-p[0][1])<G*.8&&p.length>2){cerrar();return}
    if(p.length&&orto){const l=p[p.length-1];if(Math.abs(x-l[0])>Math.abs(y-l[1]))y=l[1];else x=l[0]}
    const l=p[p.length-1];if(l&&l[0]==x&&l[1]==y)return;p.push([x,y]);guardar();dibujaPlanta()};
}
function muro(){
  const es=E(),i=vista.m,w=es.muros[i],n=es.puntos.length;
  $('app').innerHTML=`
  <div class="row" style="justify-content:space-between"><h2>Muro ${i+1} <small style="font-size:15px;color:var(--mut)">de ${n} · ${esc(es.nombre)}</small></h2></div>
  <div class="fig" style="height:min(40vh,300px)"><svg id="sv"></svg></div>
  <div class="pn"><div class="g3"><div><label for="wL">Largo (cm)</label><input id="wL" inputmode="decimal" value="${cm(w.largo)}"></div>
   <div><label for="wE">Espesor (cm)</label><input id="wE" inputmode="decimal" placeholder="${cm(es.espesor)}" value="${cm(w.espesor)}"></div>
   <div><label for="wZ">Zoclo (cm)</label><input id="wZ" inputmode="decimal" placeholder="sin" value="${w.zoclo?cm(w.zoclo):''}"></div></div>
   <p class="hint">Altura ${cm(es.altura)} cm. Medidas interiores; las distancias de cada elemento van desde la esquina izquierda viendo el muro de frente.</p></div>
  <div class="pn"><b>Elementos</b><div id="els">${w.elementos.map((el,k)=>elHtml(el,k)).join('')||'<p class="hint">Sin puertas, ventanas ni contactos.</p>'}</div>
   <div class="row">${Object.entries(TIPOS).map(([t,l])=>`<button class="s" data-add="${t}">+ ${l}</button>`).join('')}</div></div>
  <div class="pn"><b>Fotos de este muro</b><div class="fotos">${(es.fotos||[]).map((f,k)=>f.muro===i+1?`<div><img src="${f.img}" alt="Foto"><button data-bf="${k}">×</button></div>`:'').join('')}</div><div class="row" style="margin-top:8px"><button class="s" id="bFoto">+ Foto</button></div></div>`;
  const ro=new ResizeObserver(()=>dibujaAlzado());ro.observe($('sv'));
  const num=(id,f)=>$(id).onchange=ev=>{f(mm(ev.target.value));guardar();dibujaAlzado()};
  num('wL',v=>w.largo=v);num('wE',v=>w.espesor=v);num('wZ',v=>w.zoclo=v||0);
  document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const t=b.dataset.add;w.elementos.push(t=='puerta'?{tipo:t,x:null,ancho:900,alto:2100}:t=='ventana'?{tipo:t,x:null,ancho:1200,alto:1200,antepecho:900}:{tipo:t,x:null,altura:t=='contacto'?300:1200});guardar();render()});
  document.querySelectorAll('[data-k]').forEach(inp=>inp.onchange=ev=>{const el=w.elementos[+inp.dataset.k];el[inp.dataset.f]=mm(ev.target.value);guardar();dibujaAlzado()});
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{w.elementos.splice(+b.dataset.del,1);guardar();render()});
  $('bFoto').onclick=()=>{fotoMuro=i+1;$('fFoto').click()};
  document.querySelectorAll('[data-bf]').forEach(b=>b.onclick=()=>{es.fotos.splice(+b.dataset.bf,1);guardar();render()});
  $('bar').innerHTML=`<button class="s" id="bPl">‹ Planta</button><button class="s" id="bAnt" ${i==0?'disabled':''}>Anterior</button><button class="p" id="bSig">${i<n-1?'Siguiente':'Terminar'}</button>`;
  $('bPl').onclick=()=>{vista.v='espacio';render()};$('bAnt').onclick=()=>{vista.m--;render()};$('bSig').onclick=()=>{if(i<n-1)vista.m++;else vista.v='espacio';render()};
}
function elHtml(el,k){const f=(c,l,v)=>`<div><label>${l}</label><input inputmode="decimal" data-k="${k}" data-f="${c}" value="${cm(v)}"></div>`;
  const campos=el.tipo=='puerta'?f('x','Desde izq.',el.x)+f('ancho','Ancho',el.ancho)+f('alto','Alto',el.alto):el.tipo=='ventana'?f('x','Desde izq.',el.x)+f('ancho','Ancho',el.ancho)+f('alto','Alto',el.alto)+f('antepecho','Antepecho',el.antepecho):f('x','Desde izq.',el.x)+f('altura','Altura',el.altura);
  return`<div class="el"><h4>${TIPOS[el.tipo]} ${k+1}<button class="s" data-del="${k}" style="min-height:32px">Quitar</button></h4><div class="g3">${campos}</div></div>`}
function dibujaAlzado(){
  const es=E(),w=es.muros[vista.m],s=$('sv');if(!s)return;const W=s.clientWidth,H=s.clientHeight;if(!W)return;
  const L=w.largo||3000,A=es.altura||2400,pad=28,k=Math.min((W-2*pad)/L,(H-2*pad)/A),ox=(W-L*k)/2,oy=(H+A*k)/2;
  const X=v=>ox+v*k,Y=v=>oy-v*k;let g=`<rect x="${X(0)}" y="${Y(A)}" width="${L*k}" height="${A*k}" fill="var(--bg)" stroke="var(--ink)" stroke-width="2"/>`;
  if(w.zoclo)g+=`<rect x="${X(0)}" y="${Y(w.zoclo)}" width="${L*k}" height="${w.zoclo*k}" fill="var(--ink)" opacity=".15"/>`;
  w.elementos.forEach((el,i)=>{const x=el.x??null;if(x==null)return;
    if(el.tipo=='puerta'||el.tipo=='ventana'){const y0=el.tipo=='ventana'?(el.antepecho||0):0;g+=`<rect x="${X(x)}" y="${Y(y0+(el.alto||0))}" width="${(el.ancho||0)*k}" height="${(el.alto||0)*k}" fill="var(--pn)" stroke="var(--ac)" stroke-width="2"/><text x="${X(x+(el.ancho||0)/2)}" y="${Y(y0+(el.alto||0)/2)+4}" text-anchor="middle" font-size="11" fill="var(--ac)">${el.tipo=='puerta'?'P':'V'}${i+1}</text>`}
    else g+=`<rect x="${X(x)-5}" y="${Y(el.altura||0)-5}" width="10" height="10" fill="${el.tipo=='contacto'?'var(--ok)':'var(--ac)'}"/><text x="${X(x)+8}" y="${Y(el.altura||0)+4}" font-size="11" fill="var(--mut)">${el.tipo=='contacto'?'C':'A'}${i+1}</text>`});
  g+=`<text x="${X(L/2)}" y="${oy+18}" text-anchor="middle" font-size="12" fill="var(--mut)">${w.largo?cm(w.largo)+' cm':'largo sin medir'}</text><text x="${X(0)-6}" y="${Y(A/2)}" text-anchor="end" font-size="12" fill="var(--mut)" transform="rotate(-90 ${X(0)-6} ${Y(A/2)})">${cm(A)}</text>`;
  s.innerHTML=g;
}

/* ---------- fotos, cargar, enviar ---------- */
let fotoMuro=null;
$('fFoto').onchange=async ev=>{const es=E();for(const f of ev.target.files){try{es.fotos.push({muro:fotoMuro,img:await comprime(f)})}catch(e){aviso('No se pudo leer una foto')}}ev.target.value='';guardar();render()};
function comprime(f){return new Promise((ok,mal)=>{const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{const m=1280,r=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.7))};im.onerror=mal;im.src=u})}
$('fCargar').onchange=async ev=>{const f=ev.target.files[0];ev.target.value='';if(!f)return;try{const d=JSON.parse(await f.text());if(d.formato!=='NODO-ESPACIO')throw 0;P=d;guardar();vista={v:'inicio'};render();aviso('Levantamiento cargado')}catch(e){aviso('Ese archivo no es un levantamiento de NODO')}};
function exportar(){const out=JSON.parse(JSON.stringify(P));out.generado=new Date().toISOString();
  out.espacios.forEach(es=>{const R=real(es);es.vertices=R?R.v:[];es.cierre=R?R.cierre:null;es.muros=(es.muros||[]).map((w,i)=>({n:i+1,...w,espesor:w.espesor||es.espesor}))});return out}
async function enviar(){
  if(!P.espacios.length){aviso('Agrega al menos un espacio');return}
  const nom=(P.proyecto||'levantamiento').trim().replace(/[^\w\- ]+/g,'').replace(/\s+/g,'_')+'_'+P.fecha.replace(/\//g,'-')+'.espacio';
  const data=JSON.stringify(exportar());
  // 1) fuera de Claude (navegador del teléfono): compartir directo a WhatsApp
  try{const f=new File([data],nom,{type:'application/octet-stream'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});aviso('Si WhatsApp solo recibió el nombre, elige «Guardar en Archivos» y compártelo desde ahí.');return}}catch(e){if(e&&e.name==='AbortError')return}
  // 2) dentro de Claude: guardar con la capacidad de descargas
  if(dl){try{await dl.save({filename:nom,data});aviso('Guardado: '+nom+'. Compártelo por WhatsApp como documento.');return}catch(e){}}
  // 3) navegador sin compartir: descarga normal
  if(!(window.claude&&window.claude.use)){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=nom;document.body.appendChild(a);a.click();a.remove();aviso('Descargado: '+nom);return}catch(e){}}
  try{await navigator.clipboard.writeText(data);aviso('No se pudo guardar el archivo; los datos quedaron copiados.')}catch(e){aviso('No se pudo guardar ni copiar')}
}
window.addEventListener('resize',()=>{if(vista.v=='espacio')dibujaPlanta()});
render();
if(window.claude&&window.claude.use)window.claude.use('downloads').then(d=>{dl=d}).catch(()=>{});
}
</script></body></html>
